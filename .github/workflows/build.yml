name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.8 (Win7 compatible)
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.18'

      - name: Install dependencies
        run: |
          pip install --timeout=120 opencv-python==4.8.1.78
          pip install --timeout=120 Pillow==10.1.0
          pip install --timeout=120 pyinstaller==6.3.0

      - name: Build exe with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name "悬浮摄像头" main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: floating-camera-exe
          path: dist/悬浮摄像头.exe
          retention-days: 30
